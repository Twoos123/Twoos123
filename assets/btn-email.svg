<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 56" width="200" height="56" role="img" aria-label="EMAIL">
<defs>
<clipPath id="frame"><rect width="200" height="56" rx="6"/></clipPath>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2029"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.3"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<style>

.label { font: 800 14px Bahnschrift, 'DIN Alternate', 'Roboto Condensed', 'Arial Narrow', 'Segoe UI', sans-serif; letter-spacing: 1.8px; fill: #fff; }
.sub { font: 600 10.5px Bahnschrift, 'DIN Alternate', 'Roboto Condensed', 'Arial Narrow', 'Segoe UI', sans-serif; letter-spacing: 0.4px; fill: #9aa5b1; }
.glow { animation: glow 2.8s ease-in-out infinite alternate; }
@keyframes glow { from { opacity: 0.55; } to { opacity: 1; } }
.shine { animation: sweep 6s ease-in-out 2.1s infinite; }
@keyframes sweep { 0% { transform: translateX(0); } 14%, 100% { transform: translateX(290px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#frame)">

<rect width="200" height="56" fill="url(#bg)"/>
<rect x="0" y="0" width="4" height="56" fill="#e3b04b" class="glow"/>
<g transform="translate(18 16)" style="color:#e3b04b"><rect x="2.5" y="5" width="19" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 6.5L12 13L21 6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></g>
<text x="54" y="26" class="label">EMAIL</text>
<text x="54" y="42" class="sub">masadbali190@gmail.com</text>
<g transform="skewX(-20)"><rect class="shine" x="-60" y="0" width="46" height="56" fill="url(#shine)"/></g>
<rect x="0.5" y="0.5" width="199" height="55" rx="6" fill="none" stroke="#fff" stroke-opacity="0.12"/>
</g>
</svg>
