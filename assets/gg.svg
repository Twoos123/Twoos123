<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" width="1000" height="170" role="img" aria-label="Visit asadbinali.com for the full portfolio">
<defs>
<clipPath id="frame"><rect width="1000" height="170" rx="14"/></clipPath>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#172a47"/><stop offset="0.5" stop-color="#0c0f14"/><stop offset="1" stop-color="#3a2d12"/></linearGradient>
<linearGradient id="gg" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
<stop offset="0" stop-color="#fff"/><stop offset="0.45" stop-color="#fff"/><stop offset="0.5" stop-color="#e4ae39"/><stop offset="0.55" stop-color="#fff"/><stop offset="1" stop-color="#fff"/>
<animate attributeName="x1" values="-1;1" dur="4s" repeatCount="indefinite"/><animate attributeName="x2" values="0;2" dur="4s" repeatCount="indefinite"/>
</linearGradient>
</defs>
<style>

.gg { font: 800 48px Bahnschrift, 'DIN Alternate', 'Roboto Condensed', 'Arial Narrow', 'Segoe UI', sans-serif; letter-spacing: 2px; }
.cta { font: 700 17px Bahnschrift, 'DIN Alternate', 'Roboto Condensed', 'Arial Narrow', 'Segoe UI', sans-serif; letter-spacing: 1px; fill: #fff; }
.sub { font: 600 11px Bahnschrift, 'DIN Alternate', 'Roboto Condensed', 'Arial Narrow', 'Segoe UI', sans-serif; letter-spacing: 2px; fill: #9aa5b1; }
.bar { animation: bar 3s ease-in-out infinite alternate; }
@keyframes bar { from { opacity: 0.35; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#frame)">

<rect width="1000" height="170" fill="url(#bg)"/>
<rect x="0.5" y="0.5" width="999" height="169" rx="14" fill="none" stroke="#fff" stroke-opacity="0.08"/>
<rect x="0" y="0" width="1000" height="3" fill="#6f9ce6" class="bar"/>
<rect x="500" y="0" width="500" height="3" fill="#e3b04b" class="bar"/>
<text x="500" y="80" text-anchor="middle" class="gg" fill="url(#gg)">asadbinali.com</text>
<text x="500" y="114" text-anchor="middle" class="cta">Projects, case studies, experience and resume</text>
<text x="500" y="144" text-anchor="middle" class="sub">EVERYTHING ABOVE IS UPDATED DAILY FROM MY GITHUB</text>
</g>
</svg>
